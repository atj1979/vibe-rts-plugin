<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Something Vibe - A WebXR VR RTS Game">
  <title>Something Vibe - VR RTS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* Enter VR Button */
    #vr-button {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #667eea;
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    #vr-button:hover {
      background: rgba(102, 126, 234, 0.8);
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
    }

    #vr-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Info Panel */
    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: auto;
      backdrop-filter: blur(10px);
      max-width: 300px;
    }

    #info-panel h3 {
      margin-bottom: 8px;
      color: #667eea;
    }

    #info-panel p {
      margin: 4px 0;
      line-height: 1.4;
    }

    /* Performance Stats */
    #stats {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }

    .stat-line {
      margin: 2px 0;
    }

    /* Loading Screen */
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Something Vibe...</div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <!-- Info Panel -->
    <div id="info-panel">
      <h3>Something Vibe - VR RTS</h3>
      <p><strong>Phase:</strong> Development Demo</p>
      <p><strong>Status:</strong> <span id="status-text">Initializing...</span></p>
      <p style="margin-top: 12px; font-size: 12px; opacity: 0.8;">
        This is a performance-optimized WebXR VR game. HTTPS and WebXR support required.
      </p>
    </div>

    <!-- Performance Stats -->
    <div id="stats">
      <div class="stat-line">FPS: <span id="fps">60</span></div>
      <div class="stat-line">Frame: <span id="frametime">16</span>ms</div>
      <div class="stat-line">Draw Calls: <span id="drawcalls">0</span></div>
      <div class="stat-line">Triangles: <span id="triangles">0</span></div>
    </div>

    <!-- VR Button -->
    <button id="vr-button" disabled>
      Checking WebXR Support...
    </button>
  </div>

  <!-- Main Application Entry Point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
